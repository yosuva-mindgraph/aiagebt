# ============================================================================
# nginx main config for the Airport in a Box deck container.
#
# Replaces the stock /etc/nginx/nginx.conf for two reasons:
#
#   1. NO `user` DIRECTIVE. The stock file starts `user nginx;`, which is only
#      meaningful when the master process is root. This container runs as uid
#      101 from the start (see Dockerfile `USER`), so that line would emit a
#      warning on every boot and do nothing. Dropping it is the honest version.
#
#   2. EVERY WRITABLE PATH MOVED TO /tmp. nginx wants to write a pid file and
#      several temp dirs, and the stock locations (/var/run, /var/cache/nginx)
#      are root-owned. Pointing them all at /tmp is what lets this image run
#      with `--read-only` and a tmpfs, which is how it should be run on a VM.
# ============================================================================

worker_processes auto;

pid        /tmp/nginx.pid;
error_log  /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The deck is full of em dashes, arrows and box-drawing characters, and it
    # is served as one document with no <meta charset> reachable before the
    # header is parsed. Without this nginx sends a bare `text/html` and the
    # browser is free to guess; it gets Content-Type: text/html; charset=utf-8.
    charset      utf-8;

    # Everything nginx might write, under one tmpfs-able root. Nothing in this
    # container writes outside /tmp and /dev/std{out,err}.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    access_log   /dev/stdout;

    sendfile     on;
    tcp_nopush   on;
    keepalive_timeout 30;

    # Don't advertise the version to anything that port-scans the VM.
    server_tokens off;

    # ── compression ────────────────────────────────────────────────────────
    # gzip_static serves the index.html.gz that the BUILDER stage produced with
    # gzip -9. Compressing once at image-build time beats compressing on every
    # request: the client gets maximum-effort compression and the container
    # spends no CPU at all. Measured on this deck: 1,063,435 -> 624,318 bytes,
    # 41% off the wire.
    #
    # Most of the raw file is base64 font data (~730 KB of the 1.01 MB). woff2
    # is already compressed, so gzip is not re-compressing the fonts — it is
    # recovering the ~33% inflation base64 added when they were embedded. That
    # is why the ratio stays good even though "it's mostly fonts".
    gzip_static on;

    # Nothing is served here that gzip_static has not already handled, and
    # /healthz is nine bytes. On-the-fly gzip would only burn CPU.
    gzip off;

    include /etc/nginx/conf.d/*.conf;
}
